<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Şifreni Sıfırla — PomoSprint</title>
  <meta name="theme-color" content="#F6F0EA">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23EE6C55'/%3E%3Cpath d='M10 8h12M10 24h12M11.5 8c0 4 2.5 5.8 4.5 8-2 2.2-4.5 4-4.5 8M20.5 8c0 4-2.5 5.8-4.5 8 2 2.2 4.5 4 4.5 8' stroke='%23fff' stroke-width='2.2' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: var(--bg-primary, #F6F0EA);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .container {
      background: #fff;
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      max-width: 400px;
      width: 100%;
      box-sizing: border-box;
    }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h1 {
      font-family: 'Baloo 2', sans-serif;
      color: #333;
      margin: 0 0 12px 0;
      font-size: 28px;
      line-height: 1.2;
    }
    p {
      font-family: 'Nunito', sans-serif;
      color: #666;
      font-size: 16px;
      margin: 0 0 24px 0;
      line-height: 1.5;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      font-family: 'Nunito', sans-serif;
      font-size: 16px;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1.5px solid #EEE3DD;
      margin-bottom: 12px;
      outline: none;
    }
    input:focus { border-color: #EE6C55; }
    .btn {
      display: inline-block;
      background-color: #EE6C55;
      color: white;
      text-decoration: none;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 18px;
      padding: 16px 32px;
      border-radius: 100px;
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
      border: none;
      cursor: pointer;
      width: 100%;
      box-sizing: border-box;
      margin-top: 8px;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(238, 108, 85, 0.3); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .error { color: #C0392B; font-family: 'Nunito', sans-serif; font-size: 14px; margin-top: 10px; min-height: 18px; }
  </style>
</head>
<body>
  <div class="container" id="container">
    <div class="icon" id="icon">🔑</div>
    <h1 id="title">Yeni Şifre Belirle</h1>
    <p id="message">Hesabın için yeni bir şifre gir.</p>

    <div id="formArea">
      <input type="password" id="pw1" placeholder="Yeni şifre (en az 6 karakter)" autocomplete="new-password">
      <input type="password" id="pw2" placeholder="Yeni şifre (tekrar)" autocomplete="new-password">
      <button class="btn" id="submitBtn" onclick="submitPassword()">Şifreyi Güncelle</button>
      <div class="error" id="errorMsg"></div>
    </div>
  </div>

  <script>
    // Supabase Config (public-safe: URL + anon key, RLS ile korunur)
    const SUPABASE_URL = 'https://eoosnyakvxmifmexpgxa.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvb3NueWFrdnhtaWZtZXhwZ3hhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxODYxNTYsImV4cCI6MjEwMDc2MjE1Nn0.W1_L04jD_cP-HuvSAOc2sb0ov5o5jsqpD6DyS7khd3Y';

    const hash = window.location.hash;
    const params = new URLSearchParams(hash.startsWith('#') ? hash.slice(1) : hash);
    const accessToken = params.get('access_token');
    const type = params.get('type');
    const hasError = params.has('error') || params.has('error_code') || params.has('error_description');

    const icon = document.getElementById('icon');
    const title = document.getElementById('title');
    const message = document.getElementById('message');
    const formArea = document.getElementById('formArea');
    const errorMsg = document.getElementById('errorMsg');

    if (hasError || !accessToken || type !== 'recovery') {
      icon.textContent = '⚠️';
      title.textContent = 'Bağlantı Geçersiz';
      const desc = params.get('error_description');
      message.textContent = desc
        ? 'Bu şifre sıfırlama bağlantısı geçersiz ya da süresi dolmuş: ' + decodeURIComponent(desc.replace(/\+/g, ' ')) + '. Lütfen uygulamadan yeni bir bağlantı iste.'
        : 'Bu şifre sıfırlama bağlantısı geçersiz ya da süresi dolmuş. Lütfen uygulamadan yeni bir bağlantı iste.';
      formArea.style.display = 'none';
    }

    async function submitPassword() {
      const pw1 = document.getElementById('pw1').value;
      const pw2 = document.getElementById('pw2').value;
      errorMsg.textContent = '';

      if (pw1.length < 6) {
        errorMsg.textContent = 'Şifre en az 6 karakter olmalı.';
        return;
      }
      if (pw1 !== pw2) {
        errorMsg.textContent = 'Girdiğin şifreler eşleşmiyor.';
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Güncelleniyor...';

      try {
        const res = await fetch(SUPABASE_URL + '/auth/v1/user', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + accessToken,
          },
          body: JSON.stringify({ password: pw1 }),
        });

        if (res.ok) {
          icon.textContent = '✅';
          title.textContent = 'Şifren Güncellendi!';
          message.textContent = 'Artık uygulamaya yeni şifrenle giriş yapabilirsin.';
          formArea.style.display = 'none';
        } else {
          const data = await res.json().catch(() => ({}));
          errorMsg.textContent = data.msg || data.error_description || 'Şifre güncellenemedi, lütfen tekrar dene.';
          btn.disabled = false;
          btn.textContent = 'Şifreyi Güncelle';
        }
      } catch (e) {
        errorMsg.textContent = 'Bağlantı hatası, lütfen tekrar dene.';
        btn.disabled = false;
        btn.textContent = 'Şifreyi Güncelle';
      }
    }
  </script>
</body>
</html>
