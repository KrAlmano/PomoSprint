<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Şifreni Sıfırla — PomoSprint</title>
  <meta name="description" content="PomoSprint hesabın için yeni bir şifre belirle.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://pomosprint.app/reset-password">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="PomoSprint">
  <meta property="og:title" content="Şifreni Sıfırla — PomoSprint">
  <meta property="og:description" content="PomoSprint hesabın için yeni bir şifre belirle.">
  <meta property="og:url" content="https://pomosprint.app/reset-password">
  <meta property="og:image" content="https://pomosprint.app/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#F6F0EA">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/fonts.css?v=20261003">
  <link rel="stylesheet" href="/css/style.css?v=20261007a">
  <link rel="stylesheet" href="/css/auth.css?v=20261003b">
</head>
<body class="auth-page">
  <a href="/" class="brand" aria-label="PomoSprint ana sayfa" data-i18n-aria="home">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#EE6C55"/><path d="M10 8h12M10 24h12M11.5 8c0 4 2.5 5.8 4.5 8-2 2.2-4.5 4-4.5 8M20.5 8c0 4-2.5 5.8-4.5 8 2 2.2 4.5 4 4.5 8" stroke="#fff" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
    <span class="brand-name">Pomo<em>Sprint</em></span>
  </a>

  <main class="auth-card">
    <div class="auth-icon" id="icon" data-icon="key" aria-hidden="true">
      <svg class="ai ai-key" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.3-9.3"/><path d="m16 7 3 3"/><path d="m18.5 4.5 2 2"/></svg>
      <svg class="ai ai-warn" viewBox="0 0 24 24"><path d="M10.3 3.9 2.4 17.6a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
      <svg class="ai ai-ok" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </div>
    <h1 id="title" data-i18n="title">Yeni Şifre Belirle</h1>
    <p class="auth-message" id="message" role="status" aria-live="polite" data-i18n="checking">Bağlantın kontrol ediliyor…</p>
    <noscript><p class="auth-message">Bu sayfa JavaScript gerektirir. Tarayıcında JavaScript'i açıp bağlantıyı yeniden aç.</p><p class="auth-message" lang="en">This page requires JavaScript. Turn on JavaScript in your browser and open the link again.</p></noscript>

    <form class="auth-form" id="form" novalidate hidden>
      <input type="email" id="username" name="username" autocomplete="username" class="sr-only" tabindex="-1" aria-hidden="true">
      <div class="auth-field">
        <label for="pw1" data-i18n="pw1">Yeni şifre</label>
        <input type="password" id="pw1" name="new-password" autocomplete="new-password" minlength="8" maxlength="72" required aria-describedby="pw1-hint">
        <span class="auth-hint" id="pw1-hint" data-i18n="hint">En az 8 karakter; en az bir küçük harf, bir büyük harf ve bir rakam.</span>
      </div>
      <div class="auth-field">
        <label for="pw2" data-i18n="pw2">Yeni şifre (tekrar)</label>
        <input type="password" id="pw2" name="confirm-password" autocomplete="new-password" minlength="8" maxlength="72" required>
      </div>
      <button type="submit" class="btn btn-primary" id="submit" data-i18n="submit">Şifreyi Güncelle</button>
      <p class="auth-error" id="error" role="alert"></p>
    </form>
  </main>

  <p class="auth-foot"><span data-i18n="foot">Sorun mu yaşıyorsun?</span> <a href="mailto:destek@pomosprint.app">destek@pomosprint.app</a></p>

  <script src="/js/config.js?v=20261007a" defer></script>
  <script src="/js/auth-i18n.js?v=20261003b" defer></script>
  <script src="/js/reset-password.js?v=20261007a" defer></script>
</body>
</html>
