<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Şifreni Sıfırla — PomoSprint</title>
  <meta name="description" content="PomoSprint hesabın için yeni bir şifre belirle.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://pomosprint.app/reset-password">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="PomoSprint">
  <meta property="og:title" content="Şifreni Sıfırla — PomoSprint">
  <meta property="og:description" content="PomoSprint hesabın için yeni bir şifre belirle.">
  <meta property="og:url" content="https://pomosprint.app/reset-password">
  <meta property="og:image" content="https://pomosprint.app/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#F6F0EA">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=20261003">
  <link rel="stylesheet" href="/css/auth.css?v=20261003">
</head>
<body class="auth-page">
  <a href="/" class="brand" aria-label="PomoSprint ana sayfa">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#EE6C55"/><path d="M10 8h12M10 24h12M11.5 8c0 4 2.5 5.8 4.5 8-2 2.2-4.5 4-4.5 8M20.5 8c0 4-2.5 5.8-4.5 8 2 2.2 4.5 4 4.5 8" stroke="#fff" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
    <span class="brand-name">Pomo<em>Sprint</em></span>
  </a>

  <main class="auth-card">
    <div class="auth-icon" id="icon" aria-hidden="true">🔑</div>
    <h1 id="title">Yeni Şifre Belirle</h1>
    <p class="auth-message" id="message" role="status" aria-live="polite">Bağlantın kontrol ediliyor…</p>
    <noscript><p class="auth-message">Bu sayfa JavaScript gerektirir. Tarayıcında JavaScript'i açıp bağlantıyı yeniden aç.</p></noscript>

    <form class="auth-form" id="form" novalidate hidden>
      <input type="email" id="username" name="username" autocomplete="username" class="sr-only" tabindex="-1" aria-hidden="true">
      <div class="auth-field">
        <label for="pw1">Yeni şifre</label>
        <input type="password" id="pw1" name="new-password" autocomplete="new-password" minlength="6" maxlength="72" required aria-describedby="pw1-hint">
        <span class="auth-hint" id="pw1-hint">En az 6 karakter.</span>
      </div>
      <div class="auth-field">
        <label for="pw2">Yeni şifre (tekrar)</label>
        <input type="password" id="pw2" name="confirm-password" autocomplete="new-password" minlength="6" maxlength="72" required>
      </div>
      <button type="submit" class="btn btn-primary" id="submit">Şifreyi Güncelle</button>
      <p class="auth-error" id="error" role="alert"></p>
    </form>
  </main>

  <p class="auth-foot">Sorun mu yaşıyorsun? <a href="mailto:destek@pomosprint.app">destek@pomosprint.app</a></p>

  <script src="/js/config.js?v=20261003" defer></script>
  <script src="/js/reset-password.js?v=20261003" defer></script>
</body>
</html>
