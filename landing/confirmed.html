<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mail Onaylandı — PomoSprint</title>
  <meta name="theme-color" content="#F6F0EA">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23EE6C55'/%3E%3Cpath d='M10 8h12M10 24h12M11.5 8c0 4 2.5 5.8 4.5 8-2 2.2-4.5 4-4.5 8M20.5 8c0 4-2.5 5.8-4.5 8 2 2.2 4.5 4 4.5 8' stroke='%23fff' stroke-width='2.2' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: var(--bg-primary, #F6F0EA);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .container {
      background: #fff;
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      max-width: 400px;
      width: 100%;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 16px;
    }
    h1 {
      font-family: 'Baloo 2', sans-serif;
      color: #333;
      margin: 0 0 12px 0;
      font-size: 32px;
      line-height: 1.2;
    }
    p {
      font-family: 'Nunito', sans-serif;
      color: #666;
      font-size: 18px;
      margin: 0 0 32px 0;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      background-color: #EE6C55;
      color: white;
      text-decoration: none;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 18px;
      padding: 16px 32px;
      border-radius: 100px;
      transition: transform 0.2s, box-shadow 0.2s;
      border: none;
      cursor: pointer;
      width: 100%;
      box-sizing: border-box;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(238, 108, 85, 0.3);
    }
    .btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="container" id="container">
    <div class="icon" id="icon">✅</div>
    <h1 id="title">Mail Onaylandı!</h1>
    <p id="message">Harika, PomoSprint hesabın artık tamamen aktif. Hadi odaklanmaya başlayalım!</p>
    <button class="btn" id="actionBtn" onclick="openApp()">Uygulamayı Aç</button>
  </div>

  <script>
    // Supabase, /verify sonucunu URL hash'ine ekler:
    //   Başarılı  -> #access_token=...&type=signup (veya benzeri)
    //   Başarısız -> #error=...&error_code=...&error_description=...
    // Bu sayfa önceden hash'e HİÇ bakmadan her zaman "başarılı" gösteriyordu —
    // bu yüzden linki geçersiz/süresi dolmuş olan kullanıcılar bile "hesabın
    // aktif" mesajını görüp uygulamada giriş yapamayınca kafası karışıyordu.
    const hash = window.location.hash;
    const params = new URLSearchParams(hash.startsWith('#') ? hash.slice(1) : hash);
    const hasError = params.has('error') || params.has('error_code') || params.has('error_description');

    if (hasError) {
      document.getElementById('icon').textContent = '⚠️';
      document.getElementById('title').textContent = 'Onay Bağlantısı Geçersiz';
      const desc = params.get('error_description');
      document.getElementById('message').textContent = desc
        ? 'Bu onay bağlantısı geçersiz ya da süresi dolmuş: ' + decodeURIComponent(desc.replace(/\+/g, ' ')) + '. Lütfen uygulamaya dönüp yeni bir onay maili iste.'
        : 'Bu onay bağlantısı geçersiz ya da süresi dolmuş. Lütfen uygulamaya dönüp yeni bir onay maili iste.';
      const btn = document.getElementById('actionBtn');
      btn.textContent = 'Uygulamaya Dön';
    }

    function openApp() {
      const deepLinkUrl = "io.supabase.pomosprint://login-callback" + hash;
      window.location.href = deepLinkUrl;
      const btn = document.getElementById('actionBtn');
      const original = btn.textContent;
      btn.textContent = "Açılıyor...";
      setTimeout(() => {
        btn.textContent = original;
      }, 2000);
    }
  </script>
</body>
</html>
