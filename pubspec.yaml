name: pomodoro
description: "PomoSprint: oyunlaştırılmış Pomodoro çalışma uygulaması."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  shared_preferences: ^2.5.2
  supabase_flutter: ^2.8.3
  flutter_dotenv: ^5.2.1
  uuid: ^4.5.1
  lottie: ^3.1.2
  google_sign_in: ^6.2.1
  connectivity_plus: ^6.1.3
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.7
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  url_launcher: ^6.3.1
  sentry_flutter: ^9.26.0
  # Profil'deki sürüm satırı ve destek e-postasındaki sürüm bilgisi.
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Simülatörde, yerel Supabase kopyasına bağlı uçtan uca testler
  # (integration_test/, tool/local_supabase/README.md "Simülatörde uçtan uca test").
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  sentry_dart_plugin: ^3.4.0
  # Geciken disk yazısını testte denetler; üretim bağımlılığı eklemez.
  shared_preferences_platform_interface: ^2.4.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/icon_source.png"
  adaptive_icon_background: "#F0F5F8"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  # Android 13+ temalı simge: foreground.png'nin alfa kanalı, tek renk (beyaz).
  adaptive_icon_monochrome: "assets/icon/monochrome.png"
  min_sdk_android: 21

# Renkler Flutter açılış ekranıyla (SplashView) aynı: açık AppColors.surface,
# koyu AppColors.darkSurface. Koyu temalı cihazda açık renk flaşı olmaz.
# Değiştirince: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#F8F9FB"
  color_dark: "#130D0D"
  image: "assets/icon/foreground.png"
  android: true
  ios: true
  web: false
  android_12:
    color: "#F8F9FB"
    color_dark: "#130D0D"
    # Android 12+ simgeyi çapı tuvalin 2/3'ü olan daireyle kırpar;
    # splash_android12.png aynı logonun daireye sığacak kadar küçültülmüşü.
    image: "assets/icon/splash_android12.png"
    image_dark: "assets/icon/splash_android12.png"

# sentry_dart_plugin: release derlemesinden sonra Dart sembollerini ve
# obfuscation haritasını Sentry'ye yükler (scripts/build_release.sh çağırır).
# org, project ve auth_token BURAYA YAZILMAZ: SENTRY_ORG, SENTRY_PROJECT,
# SENTRY_AUTH_TOKEN ortam değişkenlerinden (scripts/.env) okunur. Sembol
# klasörü, harita, release ve dist betikten --sentry-define ile verilir.
sentry:
  upload_debug_symbols: true
  upload_sources: false
  upload_source_maps: false
  commits: false

flutter:
  generate: true
  uses-material-design: true
  assets:
    # UYARI: .env APK/IPA içine düz metin olarak gömülür. Yalnızca istemciye
    # açık değerler (SUPABASE_URL, SUPABASE_ANON_KEY, SENTRY_DSN) koyun;
    # service role / Resend gibi sırlar yalnızca scripts/.env'de durmalı.
    - .env
    - assets/icon/icon_source.png
    - assets/avatars/
    - assets/sand_timer.json
